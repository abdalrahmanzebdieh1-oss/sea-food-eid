      function loadStoreData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.DATA);
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              settings: Object.assign({}, DEFAULT_DATA.settings, parsed.settings || {}),
              categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : DEFAULT_DATA.categories,
              items: Array.isArray(parsed.items) ? parsed.items : DEFAULT_DATA.items,
              deliveryZones: Array.isArray(parsed.deliveryZones) ? parsed.deliveryZones : DEFAULT_DATA.deliveryZones,
              addons: Array.isArray(parsed.addons) ? parsed.addons : DEFAULT_DATA.addons,
              coupons: Array.isArray(parsed.coupons) ? parsed.coupons : DEFAULT_DATA.coupons
            };
          }
        } catch (e) { /* fallback */ }
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }

      function saveStoreData() {
        try {
          localStorage.setItem(STORAGE_KEYS.DATA, JSON.stringify(state.data));
        } catch (e) {
          showToast("تنبيه: مساحة التخزين ممتلئة، يُفضل تقليل حجم الصور", "error");
        }
      }

      function loadCart() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.CART);
          return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
      }

      function saveCart() {
        try {
          localStorage.setItem(STORAGE_KEYS.CART, JSON.stringify(state.cart));
        } catch (e) { /* ignore */ }
      }

      function isStoreOpen() {
        try {
          const { openTime, closeTime } = state.data.settings;
          if (!openTime || !closeTime) return true;
          const now = new Date();
          const curMins = now.getHours() * 60 + now.getMinutes();
          const [oh, om] = openTime.split(':').map(Number);
          const [ch, cm] = closeTime.split(':').map(Number);
          const openMins = oh * 60 + (om || 0);
          const closeMins = ch * 60 + (cm || 0);

          if (closeMins < openMins) {
            return curMins >= openMins || curMins <= closeMins;
          }
          return curMins >= openMins && curMins <= closeMins;
        } catch (e) {
          return true;
        }
      }

      function formatTime12(t24) {
        if (!t24) return '';
        const [hStr, mStr] = t24.split(':');
        let h = parseInt(hStr, 10);
        const period = h >= 12 ? 'م' : 'ص';
        h = h % 12 || 12;
        return `${h}:${mStr || '00'} ${period}`;
      }

      function showToast(msg, type = "info") {
        const container = document.getElementById("toastContainer");
        if (!container) return;
        const el = document.createElement("div");
        const bg = type === "error" ? "bg-rose-600" : type === "success" ? "bg-emerald-600" : "bg-[#0f2942]";
        el.className = `${bg} text-white px-4 py-3 rounded-2xl shadow-lg text-xs font-bold flex items-center justify-between gap-2 animate-slide-up pointer-events-auto`;
        el.innerHTML = `<span>${sanitize(msg)}</span>`;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity 0.25s";
          setTimeout(() => el.remove(), 260);
        }, 2800);
      }

                    class="shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold transition border ${

      function getPriceDisplay(item) {
        if (item.options && item.options.length > 0) {
          const prices = item.options.map(o => Number(o.price)).filter(p => p > 0);
          if (prices.length > 0) {
            const min = Math.min(...prices);
            const max = Math.max(...prices);
            return min === max
              ? `<span class="text-sm font-black text-[#0b74b8]">${min} ج.م</span>`
              : `<span class="text-sm font-black text-[#0b74b8]">${min} - ${max} ج.م</span>`;
          }
        }
        if (Number(item.price) > 0) {
          return `<span class="text-sm font-black text-[#0b74b8]">${item.price} ج.م</span>`;
        }
        const label = item.priceLabel || "سعر اليوم";
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-amber-100 text-amber-800 border border-amber-300 text-xs font-extrabold">${sanitize(label)}</span>`;
      }

      function renderMenu() {
        const container = document.getElementById("menuContainer");
        const q = state.searchQuery.trim().toLowerCase();
        const viewOnly = Boolean(state.data.settings.viewOnlyMode);

        let filtered = state.data.items.filter(item => item.available !== false);
        if (state.activeCategory !== "الكل" && !q) {
          filtered = filtered.filter(item => item.category === state.activeCategory);
        }
        if (q) {
          filtered = filtered.filter(item =>
            item.name.toLowerCase().includes(q) ||
            (item.desc && item.desc.toLowerCase().includes(q)) ||
            item.category.toLowerCase().includes(q)
          );
        }

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="bg-white rounded-2xl border border-[#e2d5c3] p-8 text-center">
              <p class="text-sm font-bold text-slate-500">لا توجد أصناف مطابقة لبحثك حالياً.</p>
              <button type="button" onclick="window.clearSearch(); window.selectCategory('الكل');"
                      class="mt-3 px-4 py-2 rounded-xl bg-[#0b74b8] text-white text-xs font-bold">عرض كل المنيو</button>
            </div>`;
          return;
        }

        const groups = {};
        if (state.activeCategory === "الكل" || q) {
          state.data.categories.forEach(c => { groups[c] = []; });
          filtered.forEach(item => {
            if (!groups[item.category]) groups[item.category] = [];
            groups[item.category].push(item);
          });
        } else {
          groups[state.activeCategory] = filtered;
        }

        let html = "";
        Object.keys(groups).forEach(cat => {
          const list = groups[cat];
          if (!list || list.length === 0) return;
          const isOfferCat = cat === "🔥 العروض";

          html += `
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="w-1.5 h-6 rounded-full ${isOfferCat ? 'bg-[#d97706]' : 'bg-[#0b74b8]'}"></span>

              </div>
              <div class="space-y-2.5">
                ${list.map(item => renderItemCard(item, viewOnly)).join("")}
              </div>
            </div>`;
        });

        container.innerHTML = html;

      function renderItemCard(item, viewOnly) {

                ${item.desc ? `<p class="text-[11px] text-slate-600 mt-1 leading-relaxed line-clamp-2">${sanitize(item.desc)}</p>` : ''}

                    ${item.options.map(o => `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${isOffer ? 'bg-amber-100/80 text-amber-900 border-amber-300' : 'bg-[#f5efe6] text-[#084c7a] border-[#e2d5c3]'} border">${sanitize(o.name)}</span>`).join("")}

        if (s.facebookUrl) links.push({ url: s.facebookUrl, label: "فيسبوك", icon: "facebook" });
        if (s.instagramUrl) links.push({ url: s.instagramUrl, label: "إنستجرام", icon: "instagram" });
        if (s.tiktokUrl) links.push({ url: s.tiktokUrl, label: "تيك توك", icon: "video" });

        const socialWrap = document.getElementById("footerSocialLinks");
        socialWrap.innerHTML = links.map(l => `
          <a href="${sanitize(l.url)}" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold transition">
            <i data-lucide="${l.icon}" class="w-3.5 h-3.5 text-amber-300"></i>
            <span>${l.label}</span>
          </a>`).join("");
      }

      function getCartTotals() {
        let subtotal = 0;
        let hasVariableItems = false;
        state.cart.forEach(entry => {
          const linePrice = (Number(entry.unitPrice) + Number(entry.addonsTotal || 0)) * entry.qty;
          subtotal += linePrice;
          if (Number(entry.unitPrice) === 0) hasVariableItems = true;
        });

        let discount = 0;
        if (state.data.settings.couponsEnabled && state.appliedCoupon && subtotal > 0) {
          if (state.appliedCoupon.type === "percent") {
            discount = Math.round((subtotal * state.appliedCoupon.value) / 100);
          } else {
            discount = Math.min(subtotal, Number(state.appliedCoupon.value));
          }
        }

        let deliveryFee = 0;
        if (state.orderMode === "delivery") {
          const zone = state.data.deliveryZones.find(z => Number(z.id) === Number(state.selectedZoneId)) || state.data.deliveryZones[0];
          deliveryFee = zone ? Number(zone.fee) : 0;
        }

        const total = Math.max(0, subtotal - discount + deliveryFee);
        const totalQty = state.cart.reduce((s, c) => s + c.qty, 0);
        return { subtotal, discount, deliveryFee, total, totalQty, hasVariableItems };
      }

      function renderFloatingCartBar() {
        const bar = document.getElementById("floatingCartBar");
        const viewOnly = Boolean(state.data.settings.viewOnlyMode);
        const { total, totalQty, hasVariableItems } = getCartTotals();

        if (viewOnly || totalQty === 0) {
          bar.classList.add("hidden");
          return;
        }
        bar.classList.remove("hidden");
        document.getElementById("cartCountBadge").textContent = totalQty;
        document.getElementById("cartTotalBar").textContent = `${total} ج.م${hasVariableItems ? ' + وزن' : ''}`;
        document.getElementById("cartBarSubtext").textContent = hasVariableItems ? "يشمل أصناف تُسعّر حسب الوزن/اليوم" : "اضغط لمراجعة الطلب وإرساله";
      }

      window.selectCategory = function (cat) {
        state.activeCategory = cat;
        renderCategoryTabs();
        renderMenu();
      };

      window.handleSearch = function (val) {
        state.searchQuery = val;
        const btn = document.getElementById("clearSearchBtn");
        if (val && val.trim()) btn.classList.remove("hidden");
        else btn.classList.add("hidden");
        renderMenu();
      };

      window.clearSearch = function () {
        state.searchQuery = "";
        const inp = document.getElementById("searchInput");
        if (inp) inp.value = "";
        document.getElementById("clearSearchBtn").classList.add("hidden");
        renderMenu();
      };

      window.shareMenu = async function () {
        const s = state.data.settings;
        const shareData = { title: `${s.name} - المنيو الإلكتروني`, text: `تصفح منيو ${s.name} واطلب أونلاين الآن!`, url: window.location.href };
        if (navigator.share) {
          try { await navigator.share(shareData); return; } catch (e) { /* fallback */ }
        }
        try {
          const ta = document.createElement("textarea");
          ta.value = window.location.href;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          showToast("تم نسخ رابط المنيو للمشاركة!", "success");
        } catch (e) {
          showToast("تعذر نسخ الرابط تلقائياً", "error");
        }
      };

      window.closeModal = function () {
        const mc = document.getElementById("modalContainer");
        if (mc) mc.innerHTML = "";
      };

      let modalItemState = { item: null, optionIdx: 0, addonIds: [], qty: 1, note: "" };

      window.openItemModal = function (itemId) {
        if (state.data.settings.viewOnlyMode) return;
        const item = state.data.items.find(i => Number(i.id) === Number(itemId));
        if (!item) return;

        modalItemState = { item, optionIdx: 0, addonIds: [], qty: 1, note: "" };
        renderItemModal();
      };

      function renderItemModal() {

          const a = state.data.addons.find(x => Number(x.id) === Number(id));
          return sum + (a ? Number(a.price) : 0);

        const mc = document.getElementById("modalContainer");
        mc.innerHTML = `

                </button>
              </div>

              <div class="flex-1 min-h-0 overflow-y-auto p-4 space-y-4">

                ${item.desc ? `<p class="text-xs text-slate-600 leading-relaxed bg-[#f5efe6] p-3 rounded-xl border border-[#e2d5c3]">${sanitize(item.desc)}</p>` : ''}

                ${basePrice === 0 ? `
                  <div class="p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-xs font-bold flex items-center gap-2">

                    <span>هذا الصنف يُسعّر (${sanitize(item.priceLabel || 'سعر اليوم')})، وسيتم تأكيد الوزن والسعر النهائي معك هاتفياً أو عبر واتساب.</span>

                                    : 'border-[#e2d5c3] bg-white text-navy font-bold'

                          <span class="text-xs">${sanitize(opt.name)}</span>
                          <span class="text-xs text-[#0b74b8]">${Number(opt.price) > 0 ? opt.price + ' ج.م' : (item.priceLabel || 'سعر اليوم')}</span>
                        </button>`).join("")}
                    </div>
                  </div>` : ''}

                ${state.data.addons.length > 0 ? `
                  <div>
                    <label class="block text-xs font-black text-navy mb-2">إضافات جانبية (اختياري):</label>
                    <div class="space-y-1.5">
                      ${state.data.addons.map(ad => {
                        const checked = addonIds.includes(ad.id);
                        return `
                          <button type="button" onclick="window.toggleModalAddon(${ad.id})"
                                  class="w-full p-2.5 rounded-xl border flex items-center justify-between text-xs transition ${
                                    checked ? 'border-[#0b74b8] bg-[#e6f3fb] font-extrabold' : 'border-[#e2d5c3] bg-white font-semibold'

                              <span>${sanitize(ad.name)}</span>

                            <span class="text-[#0b74b8] font-bold">+${ad.price} ج.م</span>
                          </button>`;

                    </div>

                <div>
                  <label class="block text-xs font-black text-navy mb-1.5">ملاحظات خاصة (مثل: وزن معين، بدون شطة...):</label>
                  <input type="text" value="${sanitize(note)}" oninput="window.setModalNote(this.value)" placeholder="اكتب ملاحظاتك هنا..."

                </div>
              </div>

              <div class="p-3.5 bg-[#f5efe6] border-t border-[#e2d5c3] flex items-center gap-3 shrink-0">
                <div class="flex items-center bg-white border border-[#e2d5c3] rounded-xl p-1">
                  <button type="button" onclick="window.changeModalQty(-1)" class="w-8 h-8 rounded-lg bg-[#f5efe6] text-navy font-black flex items-center justify-center">-</button>

                  <span>إضافة للسلة</span>
                  <span>${basePrice === 0 && addonsTotal === 0 ? sanitize(item.priceLabel || 'سعر اليوم') : lineTotal + ' ج.م'}</span>
                </button>
              </div>
            </div>
          </div>`;
        if (window.lucide) window.lucide.createIcons();
      }

      window.setModalOption = function (idx) { modalItemState.optionIdx = idx; renderItemModal(); };
      window.toggleModalAddon = function (id) {
        const idx = modalItemState.addonIds.indexOf(id);
        if (idx > -1) modalItemState.addonIds.splice(idx, 1);
        else modalItemState.addonIds.push(id);
        renderItemModal();
      };
      window.setModalNote = function (val) { modalItemState.note = val; };
      window.changeModalQty = function (delta) {
        modalItemState.qty = Math.max(1, modalItemState.qty + delta);
        renderItemModal();
      };

      window.confirmAddToCart = function () {
        const { item, optionIdx, addonIds, qty, note } = modalItemState;
        const hasOpts = item.options && item.options.length > 0;
        const chosenOpt = hasOpts ? item.options[optionIdx] : null;
        const unitPrice = chosenOpt ? Number(chosenOpt.price) : Number(item.price);
        const chosenAddons = addonIds.map(id => state.data.addons.find(a => Number(a.id) === Number(id))).filter(Boolean);
        const addonsTotal = chosenAddons.reduce((s, a) => s + Number(a.price), 0);

        state.cart.push({
          uid: Date.now() + Math.random(),
          itemId: item.id,
          name: item.name,
          optionName: chosenOpt ? chosenOpt.name : "",
          unitPrice,
          priceLabel: item.priceLabel || "",
          addons: chosenAddons,
          addonsTotal,
          qty,
          note: note.trim()
        });

        saveCart();
        window.closeModal();
        renderMenu();
        renderFloatingCartBar();
        showToast(`تمت إضافة "${item.name}" إلى السلة`, "success");
      };

              <div class="px-4 py-3.5 bg-[#0b74b8] text-white flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                  <i data-lucide="shopping-bag" class="w-5 h-5 text-amber-300"></i>
                  <h3 class="font-black text-base">سلة الطلبات وإتمام الطلب</h3>
                </div>
                <button type="button" onclick="window.closeModal()" class="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>

              <div class="flex-1 min-h-0 overflow-y-auto p-4 space-y-4">

                  <div class="space-y-2">
                    ${state.cart.map((c, idx) => `
                      <div class="p-3 rounded-2xl bg-[#faf6f0] border border-[#e2d5c3] flex items-start justify-between gap-2">

                          <p class="text-xs font-black text-navy">${sanitize(c.name)} ${c.optionName ? `<span class="text-[#0b74b8]">(${sanitize(c.optionName)})</span>` : ''}</p>
                          ${c.addons.length ? `<p class="text-[11px] text-slate-500 mt-0.5">+ ${c.addons.map(a => sanitize(a.name)).join('، ')}</p>` : ''}
                          ${c.note ? `<p class="text-[11px] text-amber-700 mt-0.5">ملاحظة: ${sanitize(c.note)}</p>` : ''}
                          <p class="text-xs font-extrabold text-[#0b74b8] mt-1">
                            ${Number(c.unitPrice) === 0 ? sanitize(c.priceLabel || 'سعر اليوم') : ((Number(c.unitPrice) + Number(c.addonsTotal)) * c.qty) + ' ج.م'}

                        <div class="flex items-center gap-1.5 shrink-0">
                          <button type="button" onclick="window.updateCartQty(${idx}, -1)" class="w-7 h-7 rounded-lg bg-white border border-[#e2d5c3] font-black text-xs">-</button>
                          <span class="w-5 text-center font-black text-xs">${c.qty}</span>
                          <button type="button" onclick="window.updateCartQty(${idx}, 1)" class="w-7 h-7 rounded-lg bg-[#0b74b8] text-white font-black text-xs">+</button>

                  <div>

                      ].map(m => `

                                class="p-2.5 rounded-xl border flex flex-col items-center gap-1 text-center transition ${

                                }">

                    </div>

                    ${state.orderMode === 'dinein' ? `

                        <input type="text" value="${sanitize(checkoutForm.tableNum)}" oninput="window.updateCheckoutField('tableNum', this.value)" placeholder="مثال: طاولة 5"

                          <label class="block text-xs font-bold text-navy mb-1">الاسم *</label>
                          <input type="text" value="${sanitize(checkoutForm.name)}" oninput="window.updateCheckoutField('name', this.value)" placeholder="اسم العميل"
                                 class="w-full bg-white border border-[#e2d5c3] rounded-xl px-3 py-2 text-xs font-bold" />

                               class="w-full bg-white border border-[#e2d5c3] rounded-xl px-3 py-2 text-xs font-bold" />
                      </div>` : ''}
                  </div>

                  ${s.couponsEnabled ? `

                      <div class="flex gap-2">
                        <input type="text" value="${sanitize(checkoutForm.couponInput)}" oninput="window.updateCheckoutField('couponInput', this.value)" placeholder="أدخل الكوبون (مثل WELCOME10)"
                               class="flex-1 bg-white border border-[#e2d5c3] rounded-xl px-3 py-2 text-xs font-bold uppercase" />
                        <button type="button" onclick="window.applyCouponCode()" class="px-4 py-2 rounded-xl bg-[#084c7a] text-white text-xs font-extrabold">تطبيق</button>
                      </div>
                      ${state.appliedCoupon ? `<p class="text-[11px] text-emerald-700 font-bold mt-1">تم تطبيق الكوبون (${sanitize(state.appliedCoupon.code)}) بنجاح!</p>` : ''}
                    </div>` : ''}

                  <div>
                    <label class="block text-xs font-black text-navy mb-1.5">طريقة الدفع:</label>
                    <div class="grid grid-cols-2 gap-2">
                      <button type="button" onclick="window.setPaymentMethod('cash')"
                              class="p-2.5 rounded-xl border text-xs font-extrabold ${state.paymentMethod === 'cash' ? 'border-[#0b74b8] bg-[#e6f3fb] text-[#084c7a]' : 'border-[#e2d5c3] bg-white'}">
                        💵 كاش عند الاستلام
                      </button>
                      <button type="button" onclick="window.setPaymentMethod('instapay')"
                              class="p-2.5 rounded-xl border text-xs font-extrabold ${state.paymentMethod === 'instapay' ? 'border-[#0b74b8] bg-[#e6f3fb] text-[#084c7a]' : 'border-[#e2d5c3] bg-white'}">

      window.updateCartQty = function (idx, delta) {

        state.cart[idx].qty += delta;
        if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
        saveCart();
        renderMenu();
        renderFloatingCartBar();
        window.openCartModal();
      };

      window.setOrderMode = function (mode) { state.orderMode = mode; window.openCartModal(); };
      window.setDeliveryZone = function (id) { state.selectedZoneId = Number(id); window.openCartModal(); };
      window.setPaymentMethod = function (m) { state.paymentMethod = m; window.openCartModal(); };
      window.updateCheckoutField = function (k, v) { checkoutForm[k] = v; };

      window.applyCouponCode = function () {
        const code = normalizeArabicInput(checkoutForm.couponInput).toUpperCase();
        const found = state.data.coupons.find(c => c.active && c.code.toUpperCase() === code);
        if (!found) {
          state.appliedCoupon = null;
          showToast("كود الخصم غير صحيح أو غير مفعل", "error");
        } else {
          state.appliedCoupon = found;
          showToast("تم تفعيل كود الخصم بنجاح!", "success");
        }
        window.openCartModal();
      };

      window.detectGPS = function () {
        if (!navigator.geolocation) {
          showToast("المتصفح لا يدعم تحديد الموقع الجغرافي", "error");
          return;
        }
        showToast("جاري تحديد موقعك...");
        navigator.geolocation.getCurrentPosition(
          pos => {
            state.gpsCoords = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
            showToast("تم إرفاق رابط موقعك GPS بنجاح!", "success");
            window.openCartModal();
          },
          () => showToast("تعذر الحصول على الموقع، يرجى كتابة العنوان يدوياً", "error"),
          { timeout: 8000 }
        );
      };

      window.submitWhatsAppOrder = function () {
        const mode = state.orderMode;
        if (mode === "dinein" && !checkoutForm.tableNum.trim()) {
          showToast("يرجى إدخال رقم الطاولة أولاً", "error");
          return;
        }
        if (mode !== "dinein" && (!checkoutForm.name.trim() || !checkoutForm.phone.trim())) {
          showToast("يرجى إدخال الاسم ورقم الموبايل", "error");
          return;
        }
        if (mode === "delivery" && !checkoutForm.address.trim()) {
          showToast("يرجى إدخال عنوان التوصيل بالتفصيل", "error");
          return;
        }

        const s = state.data.settings;
        const { subtotal, discount, deliveryFee, total, hasVariableItems } = getCartTotals();
        const modeLabels = { delivery: "توصيل دليفري 🛵", takeaway: "تيك أواي 🛍️", dinein: "صالة بالمطعم 🍽️" };

        let lines = [];
        lines.push(`*طلب جديد من منيو ${s.name}* 🐟`);
        lines.push(`━━━━━━━━━━━━━━━━`);
        lines.push(`*نوع الطلب:* ${modeLabels[mode]}`);

        if (mode === "dinein") {
          lines.push(`*رقم الطاولة:* ${checkoutForm.tableNum.trim()}`);
        } else {
          lines.push(`*الاسم:* ${checkoutForm.name.trim()}`);
          lines.push(`*الموبايل:* ${normalizeArabicInput(checkoutForm.phone)}`);
        }

        if (mode === "delivery") {
          const zone = state.data.deliveryZones.find(z => Number(z.id) === Number(state.selectedZoneId));
          if (zone) lines.push(`*المنطقة:* ${zone.name} (${zone.fee} ج.م)`);
          lines.push(`*العنوان:* ${checkoutForm.address.trim()}`);
          if (state.gpsCoords) lines.push(`*الموقع GPS:* ${state.gpsCoords}`);
        }

        lines.push(`━━━━━━━━━━━━━━━━`);
        lines.push(`*الأصناف المطلوبة:*`);
        state.cart.forEach((c, idx) => {
          const unit = Number(c.unitPrice);
          const priceStr = unit === 0 ? `(${c.priceLabel || 'سعر اليوم'})` : `${(unit + Number(c.addonsTotal)) * c.qty} ج.م`;
          lines.push(`${idx + 1}. *${c.name}*${c.optionName ? ' [' + c.optionName + ']' : ''} × ${c.qty} — ${priceStr}`);
          if (c.addons.length) lines.push(`   + إضافات: ${c.addons.map(a => a.name).join('، ')}`);
          if (c.note) lines.push(`   📝 ملاحظة: ${c.note}`);
        });

        lines.push(`━━━━━━━━━━━━━━━━`);
        lines.push(`*المجموع الفرعي:* ${subtotal} ج.م`);
        if (discount > 0) lines.push(`*الخصم (${state.appliedCoupon.code}):* -${discount} ج.م`);
        if (mode === "delivery") lines.push(`*التوصيل:* ${deliveryFee} ج.م`);
        lines.push(`*الإجمالي:* ${total} ج.م${hasVariableItems ? ' (+ أصناف تُسعّر حسب الوزن/اليوم)' : ''}`);
        lines.push(`*طريقة الدفع:* ${state.paymentMethod === 'instapay' ? 'إنستاباي InstaPay' : 'كاش عند الاستلام'}`);

        const waPhone = normalizeArabicInput(s.whatsapp).replace(/[^0-9]/g, '');
        const waUrl = `https://wa.me/${waPhone}?text=${encodeURIComponent(lines.join('\n'))}`;
        window.open(waUrl, '_blank', 'noopener,noreferrer');
      };

      function getSavedPassHash() {
        return localStorage.getItem(STORAGE_KEYS.PASS) || DEFAULT_PASS_HASH;
      }

      window.openAdminAuth = function () {
        if (state.adminUnlocked) {
          window.openAdminPanel();
          return;

        const mc = document.getElementById("modalContainer");
        mc.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/65 backdrop-blur-xs flex items-center justify-center p-4" onclick="if(event.target===this) window.closeModal()">
            <div class="bg-white w-full max-w-[380px] rounded-3xl p-5 shadow-2xl animate-slide-up space-y-4">

              <input id="adminPassInput" type="password" onkeydown="if(event.key==='Enter') window.verifyAdminPass()" placeholder="كلمة المرور"
                     class="w-full border border-[#e2d5c3] rounded-xl px-3.5 py-2.5 text-sm font-bold focus:outline-none focus:border-[#0b74b8]" />
              <button type="button" onclick="window.verifyAdminPass()"

      window.verifyAdminPass = function () {
        const inp = document.getElementById("adminPassInput");
        const val = normalizeArabicInput(inp ? inp.value : "");
        if (pureHash(val) === getSavedPassHash()) {
          state.adminUnlocked = true;
          window.openAdminPanel();

                  <button type="button" onclick="window.deleteCoupon(${idx})" class="text-rose-600 font-extrabold">حذف</button>
                </div>`).join("")}
            </div>`;
        }

        if (state.adminTab === "sync") {
          const sheetUrl = localStorage.getItem(STORAGE_KEYS.SHEET) || DEFAULT_SHEET_URL;
          return `
            <div class="bg-[#faf6f0] p-3.5 rounded-2xl border border-[#e2d5c3] space-y-2.5">
              <h4 class="text-xs font-black text-[#0b74b8]">تصدير واستيراد Excel (4 تبويبات)</h4>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="window.exportExcel()" class="py-2.5 px-3 rounded-xl bg-emerald-600 text-white font-black text-xs">تصدير ملف Excel</button>
                <label class="py-2.5 px-3 rounded-xl bg-[#084c7a] text-white font-black text-xs text-center cursor-pointer">
                  استيراد Excel
                  <input type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="window.importExcel(this)" />
                </label>
              </div>
              <textarea id="tsvPasteBox" rows="3" placeholder="أو الصق جدول البيانات هنا (TSV / CSV: القسم، الاسم، السعر، الوصف، رابط الصورة)"
                        class="w-full border border-[#e2d5c3] rounded-xl p-2 text-xs font-semibold bg-white"></textarea>
              <button type="button" onclick="window.importPastedTable()" class="w-full py-2 rounded-xl bg-[#0b74b8] text-white font-bold text-xs">استيراد النص الملصق</button>
            </div>

            <div class="bg-[#faf6f0] p-3.5 rounded-2xl border border-[#e2d5c3] space-y-2">
              <h4 class="text-xs font-black text-[#0b74b8]">المزامنة التلقائية مع Google Sheets</h4>
              <input id="sheetUrlInput" value="${sanitize(sheetUrl)}" placeholder="رابط Google Sheet العام" class="w-full border border-[#e2d5c3] rounded-xl px-2.5 py-2 text-xs font-bold bg-white" />
              <button type="button" onclick="window.saveAndSyncSheet()" class="w-full py-2 rounded-xl bg-[#084c7a] text-white font-black text-xs">حفظ الرابط ومزامنة الآن</button>
            </div>

            <div class="bg-[#faf6f0] p-3.5 rounded-2xl border border-[#e2d5c3] space-y-2">
              <h4 class="text-xs font-black text-navy">تغيير كلمة مرور الإدارة وضبط المصنع</h4>
              <div class="flex gap-2">
                <input id="newAdminPass" type="password" placeholder="كلمة المرور الجديدة" class="flex-1 border border-[#e2d5c3] rounded-xl px-2.5 py-2 text-xs font-bold bg-white" />
                <button type="button" onclick="window.changeAdminPassword()" class="px-3 py-2 rounded-xl bg-[#0b74b8] text-white font-bold text-xs">تغيير</button>
              </div>
              <button type="button" onclick="window.resetFactoryData()" class="w-full py-2 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 font-extrabold text-xs">استعادة بيانات المنيو الافتراضية</button>
            </div>

            <div class="bg-slate-900 text-white p-3.5 rounded-2xl space-y-2.5">
              <h4 class="text-xs font-black text-amber-300">بوابة ترخيص المطور (منظومة تك)</h4>
              ${!state.vendorUnlocked ? `
                <div class="flex gap-2">
                  <input id="vendorKeyInput" type="password" placeholder="مفتاح ترخيص المطور" class="flex-1 bg-white/10 border border-white/20 rounded-xl px-2.5 py-2 text-xs font-bold text-white" />
                  <button type="button" onclick="window.unlockVendorGate()" class="px-3 py-2 rounded-xl bg-amber-500 text-slate-950 font-black text-xs">تفعيل</button>
                </div>` : `
                <div class="space-y-2">
                  <div class="flex items-center justify-between bg-white/10 p-2.5 rounded-xl">
                    <span class="text-xs font-bold">وضع الباقة:</span>
                    <button type="button" onclick="window.togglePackageMode()" class="px-3 py-1 rounded-lg bg-amber-400 text-slate-950 font-black text-xs">
                      ${s.viewOnlyMode ? 'العرض الذكي (تبديل لـ Pro)' : 'نسخة Pro (تبديل للعرض)'}
                    </button>
                  </div>
                  <button type="button" onclick="window.exportHtml()" class="w-full py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs">
                    تصدير ملف HTML نظيف للعميل
                  </button>
                </div>`}
            </div>`;
        }
        return "";
      }

      window.saveGeneralSettings = function () {
        const s = state.data.settings;
        s.name = document.getElementById("admName").value.trim() || s.name;
        s.subtitle = document.getElementById("admSub").value.trim();
        s.whatsapp = normalizeArabicInput(document.getElementById("admWa").value);
        s.phone1 = normalizeArabicInput(document.getElementById("admP1").value);
        s.phone2 = normalizeArabicInput(document.getElementById("admP2").value);
        s.instapayInfo = document.getElementById("admInsta").value.trim();
        s.openTime = document.getElementById("admOpen").value;
        s.closeTime = document.getElementById("admClose").value;
        s.address = document.getElementById("admAddr").value.trim();
        s.mapsUrl = document.getElementById("admMaps").value.trim();
        s.facebookUrl = document.getElementById("admFb").value.trim();
        s.bannerUrl = document.getElementById("admBannerUrl").value.trim();
        saveStoreData();
        renderApp();
        showToast("تم حفظ إعدادات المطعم بنجاح", "success");
      };

      window.uploadCompressedImage = function (input, target) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement("canvas");
            const maxW = target === "banner" ? 900 : 480;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
            if (target === "banner") {
              document.getElementById("admBannerUrl").value = dataUrl;
              state.data.settings.bannerUrl = dataUrl;
              saveStoreData();
              renderHeaderAndBanner();
            } else {
              document.getElementById("itmImg").value = dataUrl;
            }
            showToast("تم ضغط الصورة ورفعها بنجاح", "success");
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      window.saveMenuItem = function () {
        const name = document.getElementById("itmName").value.trim();
        const category = document.getElementById("itmCat").value.trim() || "🔥 العروض";
        const price = Number(document.getElementById("itmPrice").value) || 0;
        const priceLabel = document.getElementById("itmPriceLabel").value.trim();
        const desc = document.getElementById("itmDesc").value.trim();
        const image = document.getElementById("itmImg").value.trim();
        const optsRaw = document.getElementById("itmOpts").value.trim();

        if (!name) { showToast("يرجى إدخال اسم الصنف", "error"); return; }

        const options = optsRaw ? optsRaw.split(',').map(pair => {
          const [oname, oprice] = pair.split(':');
          return oname ? { name: oname.trim(), price: Number(oprice) || price } : null;
        }).filter(Boolean) : [];

        if (!state.data.categories.includes(category)) {
          state.data.categories.push(category);
        }

        if (state.editingItemId) {
          const idx = state.data.items.findIndex(i => Number(i.id) === Number(state.editingItemId));
          if (idx > -1) {
            state.data.items[idx] = { ...state.data.items[idx], name, category, price, priceLabel, desc, image, options, isOffer: category === "🔥 العروض" };
          }
          state.editingItemId = null;
        } else {
          state.data.items.unshift({ id: Date.now(), name, category, price, priceLabel, desc, image, available: true, isOffer: category === "🔥 العروض", options });
        }

        saveStoreData();
        renderApp();
        window.openAdminPanel();
        showToast("تم حفظ الصنف بنجاح", "success");
      };

      window.editMenuItem = function (id) { state.editingItemId = id; window.openAdminPanel(); };
      window.deleteMenuItem = function (id) {
        state.data.items = state.data.items.filter(i => Number(i.id) !== Number(id));
        saveStoreData();
        renderApp();
        window.openAdminPanel();
        showToast("تم حذف الصنف");
      };

      window.addDeliveryZone = function () {
        const name = document.getElementById("zoneName").value.trim();
        const fee = Number(document.getElementById("zoneFee").value) || 0;
        if (!name) return;
        state.data.deliveryZones.push({ id: Date.now(), name, fee });
        saveStoreData();
        window.openAdminPanel();
      };
      window.deleteZone = function (id) {
        state.data.deliveryZones = state.data.deliveryZones.filter(z => Number(z.id) !== Number(id));
        saveStoreData();
        window.openAdminPanel();
      };

      window.addAddon = function () {
        const name = document.getElementById("addonName").value.trim();
        const price = Number(document.getElementById("addonPrice").value) || 0;
        if (!name) return;
        state.data.addons.push({ id: Date.now(), name, price });
        saveStoreData();
        window.openAdminPanel();
      };
      window.deleteAddon = function (id) {
        state.data.addons = state.data.addons.filter(a => Number(a.id) !== Number(id));
        saveStoreData();
        window.openAdminPanel();
      };

      window.toggleCouponsEnabled = function () {
        state.data.settings.couponsEnabled = !state.data.settings.couponsEnabled;
        saveStoreData();
        window.openAdminPanel();
      };
      window.addCoupon = function () {
        const code = normalizeArabicInput(document.getElementById("cpCode").value).toUpperCase();
        const type = document.getElementById("cpType").value;
        const value = Number(document.getElementById("cpVal").value) || 0;
        if (!code || value <= 0) return;
        state.data.coupons.push({ code, type, value, active: true });
        saveStoreData();
        window.openAdminPanel();
      };
      window.deleteCoupon = function (idx) {
        state.data.coupons.splice(idx, 1);
        saveStoreData();
        window.openAdminPanel();
      };

      window.exportExcel = function () {
        if (!window.XLSX) { showToast("مكتبة Excel غير متاحة حالياً", "error"); return; }
        const wb = XLSX.utils.book_new();
        const menuRows = state.data.items.map(i => ({
          "القسم": i.category,
          "الاسم": i.name,
          "السعر": i.price,
          "وصف_السعر": i.priceLabel || "",
          "الوصف": i.desc || "",
          "الخيارات": (i.options || []).map(o => `${o.name}:${o.price}`).join(", "),
          "رابط_الصورة": i.image || ""
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(menuRows), "المنيو");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.data.deliveryZones.map(z => ({ "المنطقة": z.name, "الرسوم": z.fee }))), "مناطق التوصيل");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.data.addons.map(a => ({ "الإضافة": a.name, "السعر": a.price }))), "الإضافات");
        const s = state.data.settings;
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ "الاسم": s.name, "واتساب": s.whatsapp, "العنوان": s.address }]), "الإعدادات");
        XLSX.writeFile(wb, `${s.name}_Menu.xlsx`);
      };

      window.importExcel = function (input) {
        const file = input.files && input.files[0];
        if (!file || !window.XLSX) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const wb = XLSX.read(e.target.result, { type: "binary" });
            applyWorkbookData(wb);
            showToast("تم استيراد بيانات Excel بنجاح!", "success");
          } catch (err) {
            showToast("حدث خطأ أثناء قراءة ملف Excel", "error");
          }
        };
        reader.readAsBinaryString(file);
      };

      function applyWorkbookData(wb) {
        const menuSheet = wb.Sheets["المنيو"] || wb.Sheets[wb.SheetNames[0]];
        if (menuSheet) {
          const rows = XLSX.utils.sheet_to_json(menuSheet);
          if (rows.length > 0) {
            const newCats = [];
            const newItems = rows.map((r, idx) => {
              const cat = String(r["القسم"] || "أصناف عامة").trim();
              if (!newCats.includes(cat)) newCats.push(cat);
              const price = Number(r["السعر"]) || 0;
              const optsStr = String(r["الخيارات"] || "");
              const options = optsStr ? optsStr.split(',').map(p => {
                const [n, pr] = p.split(':');
                return n ? { name: n.trim(), price: Number(pr) || price } : null;
              }).filter(Boolean) : [];
              return {
                id: Date.now() + idx,
                category: cat,
                name: String(r["الاسم"] || "صنف").trim(),
                price,
                priceLabel: String(r["وصف_السعر"] || "").trim(),
                desc: String(r["الوصف"] || "").trim(),
                image: String(r["رابط_الصورة"] || "").trim(),
                available: true,
                isOffer: cat === "🔥 العروض",
                options
              };
            });
            state.data.categories = newCats;
            state.data.items = newItems;
          }
        }
        const zoneSheet = wb.Sheets["مناطق التوصيل"];
        if (zoneSheet) {
          const zRows = XLSX.utils.sheet_to_json(zoneSheet);
          if (zRows.length > 0) {
            state.data.deliveryZones = zRows.map((z, i) => ({ id: i + 1, name: String(z["المنطقة"] || ""), fee: Number(z["الرسوم"]) || 0 }));
          }
        }
        const addonSheet = wb.Sheets["الإضافات"];
        if (addonSheet) {
          const aRows = XLSX.utils.sheet_to_json(addonSheet);
          if (aRows.length > 0) {
            state.data.addons = aRows.map((a, i) => ({ id: i + 1, name: String(a["الإضافة"] || ""), price: Number(a["السعر"]) || 0 }));
          }
        }
        saveStoreData();
        renderApp();
      }

      window.importPastedTable = function () {
        const raw = document.getElementById("tsvPasteBox").value.trim();
        if (!raw) return;
        const lines = raw.split(/\r?\n/);
        lines.forEach((line, idx) => {
          const sep = line.includes('\t') ? '\t' : ',';
          const cols = line.split(sep).map(c => c.trim());
          if (cols.length >= 2 && cols[1]) {
            const cat = cols[0] || "🔥 العروض";
            if (!state.data.categories.includes(cat)) state.data.categories.push(cat);
            state.data.items.push({
              id: Date.now() + idx,
              category: cat,
              name: cols[1],
              price: Number(cols[2]) || 0,
              priceLabel: Number(cols[2]) > 0 ? "" : "سعر اليوم",
              desc: cols[3] || "",
              image: cols[4] || "",
              available: true,
              isOffer: cat === "🔥 العروض",
              options: []
            });
          }
        });
        saveStoreData();
        renderApp();
        showToast("تم استيراد الأصناف بنجاح", "success");
      };

      async function syncFromGoogleSheets(url, silent = false) {
        if (!url || !window.XLSX) return;
        const bar = document.getElementById("syncStatusBar");
        if (bar && !silent) bar.classList.remove("hidden");

        try {
          let exportUrl = url.trim();
          const match = exportUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
          if (match && match[1]) {
            exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=xlsx`;
          }
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 6000);
          let res;
          try {
            res = await fetch(exportUrl, { signal: controller.signal });
          } catch (e) {
            res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(exportUrl)}`, { signal: controller.signal });
          }
          clearTimeout(timer);
          if (res && res.ok) {
            const buf = await res.arrayBuffer();
            const wb = XLSX.read(buf, { type: "array" });
            applyWorkbookData(wb);
            if (!silent) showToast("تمت المزامنة مع Google Sheets بنجاح", "success");
          }
        } catch (e) {
          if (!silent) showToast("تعذرت المزامنة حالياً", "error");
        } finally {
          if (bar) bar.classList.add("hidden");
        }
      }

      window.saveAndSyncSheet = function () {
        const url = document.getElementById("sheetUrlInput").value.trim();
        localStorage.setItem(STORAGE_KEYS.SHEET, url);
        syncFromGoogleSheets(url, false);
      };

      window.changeAdminPassword = function () {
        const p = normalizeArabicInput(document.getElementById("newAdminPass").value);
        if (p.length < 4) { showToast("كلمة المرور قصيرة جداً", "error"); return; }
        localStorage.setItem(STORAGE_KEYS.PASS, pureHash(p));
        showToast("تم تحديث كلمة المرور بنجاح", "success");
      };

      window.resetFactoryData = function () {
        localStorage.removeItem(STORAGE_KEYS.DATA);
        state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveStoreData();
        renderApp();
        window.openAdminPanel();
        showToast("تمت استعادة البيانات الافتراضية", "success");
      };

      window.unlockVendorGate = function () {
        const k = document.getElementById("vendorKeyInput").value;
        if (checkVendorKey(k)) {
          state.vendorUnlocked = true;
          window.openAdminPanel();
          showToast("تم فتح بوابة ترخيص المطور", "success");
        } else {
          showToast("مفتاح الترخيص غير صحيح", "error");
        }
      };

      window.togglePackageMode = function () {
        state.data.settings.viewOnlyMode = !state.data.settings.viewOnlyMode;
        saveStoreData();
        renderApp();
        window.openAdminPanel();
      };

      window.exportHtml = function () {
        const clone = document.documentElement.cloneNode(true);
        const mc = clone.querySelector("#modalContainer");
        if (mc) mc.innerHTML = "";
        const tc = clone.querySelector("#toastContainer");
        if (tc) tc.innerHTML = "";
        const sheetUrl = localStorage.getItem(STORAGE_KEYS.SHEET) || DEFAULT_SHEET_URL;
        let htmlStr = "<!DOCTYPE html>\n" + clone.outerHTML;
        htmlStr = htmlStr.replace(/let DEFAULT_VIEW_ONLY = (true|false);/, `let DEFAULT_VIEW_ONLY = ${Boolean(state.data.settings.viewOnlyMode)};`);
        htmlStr = htmlStr.replace(/let DEFAULT_SHEET_URL = "[^"]*";/, `let DEFAULT_SHEET_URL = ${JSON.stringify(sheetUrl)};`);
        const blob = new Blob([htmlStr], { type: "text/html;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "index.html";
        a.click();
        showToast("تم تصدير ملف index.html النظيف بنجاح!", "success");
      };

      window.renderApp = renderApp;
      renderApp();
      const savedSheet = localStorage.getItem(STORAGE_KEYS.SHEET) || DEFAULT_SHEET_URL;
      if (savedSheet) syncFromGoogleSheets(savedSheet, true);
    })();
  </script>
</body>
</html>
